<svg viewBox="0 0 192 44" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OrganOx">
  <defs>
    <g id="tai">
      <circle cx="20" cy="20" r="18.6" fill="#fff" stroke="#c2008f" stroke-width="2.8"/>
      <g transform="rotate(-90 20 20)">
        <path d="M20 3 a17 17 0 0 1 0 34 z" fill="#c2008f"/>
        <circle cx="20" cy="11.5" r="8.5" fill="#c2008f"/>
        <circle cx="20" cy="28.5" r="8.5" fill="#fff"/>
      </g>
    </g>
  </defs>

  <!-- standalone mark -->
